name: Publish handbook (website + PDF)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install 'mkdocs<2' mkdocs-material==9.7.7 playwright
          python -m playwright install --with-deps chromium
      - name: Build PDF
        run: python scripts/build_pdf.py
      - name: Deploy website to GitHub Pages (gh-pages branch)
        run: mkdocs gh-deploy --force
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: learner-handbook-pdf
          path: dist/*.pdf
