<text x="316" y="672" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A2 Reference architectures, WAF</text>
<text x="316" y="688" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A3 Knowledge, data architecture</text>
<text x="316" y="704" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A4 Agent platform, integration</text>
<text x="316" y="720" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A5 Reliability, lifecycle, FinOps</text>
<text x="316" y="736" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A6 Governance, compliance</text>
<text x="316" y="752" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">A7 The architect’s craft</text>
<rect x="24" y="800" width="536" height="56" rx="8" fill="#2f6feb" fill-opacity="0.12" stroke="#2f6feb" stroke-width="2"/>
<text x="292" y="824" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Joint capstone · 80 h</text>
<text x="292" y="840" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Mixed teams of 4–5 · new client domain · red-team swap · board defense</text>
<rect x="584" y="140" width="152" height="384" rx="8" fill="#f3f4f6" stroke="#8a8f98" stroke-width="1.25"/>
<text x="660" y="164" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">The Factory</text>
<text x="660" y="188" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">Your own agentic</text>
<text x="660" y="204" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">SDLC, grown with</text>
<text x="660" y="220" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">the product.</text>
<text x="660" y="252" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">From C4 onward,</text>
<text x="660" y="268" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="middle">all product work</text>
