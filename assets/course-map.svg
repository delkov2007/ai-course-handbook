<text x="40" y="180" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">C1 How generative AI works · C2 First AI feature in .NET</text>
<text x="40" y="196" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">C3 Prompting, structured outputs, tools · C4 Coding agents · C5 Evals</text>
