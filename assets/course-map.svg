<text x="40" y="672" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D2 Durable, autonomous agents</text>
<text x="40" y="688" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D3 Multimodal, realtime agents</text>
<text x="40" y="704" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D4 Agent UX, front-ends</text>
<text x="40" y="720" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D5 Performance, cost</text>
<text x="40" y="736" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D6 Your own agent tooling</text>
<text x="40" y="752" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">D7 Agent reliability engineering</text>
