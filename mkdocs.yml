site_name: AI Solution Developer & Architect — Learner Handbook
site_description: Learning-by-doing course, release 2026.11 (content as of October
  2026)
docs_dir: book
site_dir: site
exclude_docs: 'SUMMARY.md

  i18n/

  '
theme:
  name: material
  features:
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.highlight
  - content.code.copy
  - toc.follow
  palette:
  - scheme: default
    toggle:
      icon: material/weather-night
      name: Dark mode
  - scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Light mode
  language: en
markdown_extensions:
- tables
- admonition
- attr_list
- md_in_html
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.tasklist
- toc:
    permalink: true
